<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8E1029">
<meta name="description" content="Alma Jasmine — Mis XV años. Un recuerdo para toda la vida. 04 de julio de 2026.">
<title>Alma Jasmine — Mis XV años</title>
<style>
:root{
  --ruby:#B5122B; --cherry:#8E1029; --gold:#D4AF55; --ivory:#F8EBD5;
  --ink:#35101b; --paper:#fff9ef; --muted:#8d6e62;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#f3e8d8;color:var(--ink);font-family:Georgia,"Times New Roman",serif}
button{font:inherit}
.cover-screen{
  min-height:100svh;display:grid;place-items:center;padding:30px 16px;
  background:radial-gradient(ellipse at 50% 35%,#c51c3a 0%,#8E1029 55%,#65091e 100%);
  overflow:hidden;position:relative;
}
.cover-screen:before,.cover-screen:after{
  content:"";position:absolute;inset:18px;border:1px solid rgba(212,175,85,.55);pointer-events:none
}
.cover-screen:after{inset:26px;border:1px solid rgba(248,235,213,.18)}
.cover{
  width:min(440px,88vw);min-height:min(690px,82svh);padding:34px 24px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;
  color:var(--ivory);position:relative;border:2px solid var(--gold);
  outline:1px solid rgba(212,175,85,.45);outline-offset:8px;
  background:linear-gradient(145deg,rgba(255,255,255,.08),transparent 34%),linear-gradient(160deg,#c21a36,#8E1029 62%,#760b23);
  box-shadow:0 28px 70px rgba(35,0,10,.42),inset 0 0 45px rgba(48,0,12,.25);
  transition:transform 1s ease,opacity .8s ease;
}
.cover:before,.cover:after{content:"✦";position:absolute;color:var(--gold);font-size:22px}
.cover:before{top:13px;left:16px}.cover:after{bottom:13px;right:16px}
.cover-ornament{color:var(--gold);letter-spacing:.45em;font-size:12px;text-transform:uppercase}
.rose-wrap{width:190px;height:220px;display:grid;place-items:center;position:relative;margin:6px 0}
.rose-wrap:before{content:"";position:absolute;width:172px;height:172px;border:1px solid rgba(212,175,85,.72);border-radius:50%;box-shadow:0 0 28px rgba(255,220,130,.14),inset 0 0 24px rgba(255,220,130,.1)}
.rose-wrap svg{width:150px;height:190px;filter:drop-shadow(0 10px 15px rgba(36,0,10,.35))}
h1{font-weight:normal;font-size:clamp(36px,8vw,54px);line-height:1.05;margin:0;color:var(--ivory);text-shadow:0 2px 10px rgba(40,0,10,.3)}
.cover-subtitle{font-size:21px;letter-spacing:.13em;color:#f8e5c0;margin-top:12px}
.cover-date{font-size:13px;letter-spacing:.25em;color:var(--gold);margin-top:20px}
.open-btn{
  border:1px solid var(--gold);background:var(--ivory);color:var(--cherry);
  padding:13px 25px;letter-spacing:.12em;text-transform:uppercase;font-size:11px;
  cursor:pointer;transition:.25s;box-shadow:0 5px 18px rgba(40,0,10,.2)
}
.open-btn:hover{background:#fff;color:var(--ruby);transform:translateY(-2px)}
.hint{font:italic 13px Georgia,serif;color:#f4d9bc;opacity:.9;margin-top:12px}
.book-area{display:none;min-height:100svh;padding:38px 16px 70px;background:radial-gradient(ellipse at top,#fff7eb,#ead9c4 75%)}
.book-area.visible{display:block;animation:fade .9s ease}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.book-top{text-align:center;margin:0 auto 22px;max-width:780px}
.book-top .eyebrow{color:var(--cherry);font-size:11px;letter-spacing:.25em;text-transform:uppercase}
.book-top h2{font-size:clamp(28px,5vw,42px);font-weight:normal;color:var(--cherry);margin:8px 0}
.book-top p{color:#82675c;font-style:italic;margin:0}
.book{width:min(900px,100%);margin:auto;perspective:1800px}
.page{
  background:var(--paper);min-height:520px;padding:clamp(25px,5vw,58px);
  border:1px solid #dfcda9;box-shadow:0 18px 45px rgba(83,48,25,.16);
  position:relative;transform-origin:left center;transition:transform .65s ease,opacity .45s ease;
}
.page:before{content:"";position:absolute;inset:12px;border:1px solid rgba(212,175,85,.55);pointer-events:none}
.page-inner{position:relative;z-index:1;max-width:720px;margin:auto}
.page-kicker{text-align:center;color:var(--gold);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
.page h3{text-align:center;font-weight:normal;color:var(--cherry);font-size:clamp(28px,5vw,40px);margin:12px 0}
.page-intro{text-align:center;max-width:560px;margin:0 auto 28px;color:#795d51;line-height:1.7}
.chapter-nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 auto 22px;max-width:900px}
.chapter-nav button,.pager button{
  border:1px solid #c99e4d;background:transparent;color:var(--cherry);
  padding:9px 13px;cursor:pointer;font-size:12px;transition:.2s
}
.chapter-nav button:hover,.chapter-nav button.active,.pager button:hover{background:var(--cherry);color:var(--ivory)}
.pager{display:flex;align-items:center;justify-content:center;gap:20px;margin:20px auto 0;color:#8c6c5d;font-size:12px}
.pager button:disabled{opacity:.35;cursor:not-allowed}
.photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:22px}
.photo-slot{
  min-height:180px;border:1px dashed #c9a66b;background:linear-gradient(145deg,#fbf1e2,#f1dfc8);
  display:grid;place-items:center;text-align:center;padding:16px;color:#98785e;font-size:13px;position:relative;overflow:hidden
}
.photo-slot.wide{grid-column:1/-1;min-height:230px}
.photo-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-slot span{position:relative;z-index:1;background:rgba(255,249,239,.82);padding:8px 12px}
.memory-note{margin:25px auto 0;text-align:center;color:#98785e;font-style:italic;font-size:15px}
.video-slot{margin:14px 0;padding:24px;border:1px dashed #c9a66b;background:#f6ead8;text-align:center;color:#8b6d57}
.chapter-cover{background:linear-gradient(140deg,#fff9ef,#f5e7d3)}
.end-quote{text-align:center;font-size:22px;line-height:1.6;color:var(--cherry);font-style:italic;max-width:560px;margin:30px auto}
.site-footer{text-align:center;color:#9b806c;font-size:11px;letter-spacing:.1em;margin-top:34px}
@media(max-width:560px){
 .cover{min-height:75svh;padding:26px 18px}.rose-wrap{transform:scale(.88);margin:0}
 .page{min-height:500px;padding:27px 20px}.photo-grid{grid-template-columns:1fr}.photo-slot.wide{grid-column:auto}
 .chapter-nav button{font-size:11px;padding:8px 10px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<section class="cover-screen" id="coverScreen" aria-label="Portada del álbum">
  <div class="cover">
    <div class="cover-ornament">✦ Un recuerdo para toda la vida ✦</div>
    <div class="rose-wrap" aria-label="Rosa encantada">
      <svg viewBox="0 0 180 220" role="img" aria-label="Ilustración decorativa de una rosa roja">
        <defs>
          <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff5264"/><stop offset=".55" stop-color="#c20d32"/><stop offset="1" stop-color="#71051e"/></linearGradient>
          <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#91a65a"/><stop offset="1" stop-color="#263f2c"/></linearGradient>
          <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#304b2c"/><stop offset=".5" stop-color="#9aaa59"/><stop offset="1" stop-color="#263d28"/></linearGradient>
        </defs>
        <path d="M92 105 C91 145 89 175 88 204" stroke="url(#stem)" stroke-width="5" fill="none"/>
        <path d="M89 160 C53 133 42 159 78 174 C86 174 89 168 89 160Z" fill="url(#leaf)" stroke="#d4af55" stroke-width="1"/>
        <path d="M90 180 C121 146 145 160 99 190 C94 190 91 186 90 180Z" fill="url(#leaf)" stroke="#d4af55" stroke-width="1"/>
        <path d="M91 107 C55 91 55 53 88 44 C121 42 136 77 110 104 C103 111 97 111 91 107Z" fill="url(#petal)" stroke="#e5a64c" stroke-width="1.4"/>
        <path d="M91 96 C65 87 69 59 91 54 C115 52 123 79 105 96 C100 101 95 100 91 96Z" fill="#e51b43" stroke="#f2bd65" stroke-width="1"/>
        <path d="M91 86 C79 78 83 64 94 63 C106 64 108 77 99 86 C96 89 93 88 91 86Z" fill="#ff5366" stroke="#f4c66d" stroke-width="1"/>
        <path d="M69 57 C48 39 66 17 89 38 C94 42 96 47 95 53 C85 47 77 49 69 57Z" fill="url(#petal)" stroke="#e5a64c" stroke-width="1.2"/>
        <path d="M101 52 C104 24 133 27 125 54 C121 65 113 68 104 65 C108 59 106 55 101 52Z" fill="url(#petal)" stroke="#e5a64c" stroke-width="1.2"/>
        <path d="M64 71 C35 68 39 98 69 98 C75 97 79 93 82 88 C72 87 68 81 64 71Z" fill="url(#petal)" stroke="#e5a64c" stroke-width="1.2"/>
        <path d="M116 72 C143 61 151 91 119 101 C111 102 106 97 104 91 C115 87 118 81 116 72Z" fill="url(#petal)" stroke="#e5a64c" stroke-width="1.2"/>
        <path d="M79 105 L91 118 L104 104" fill="#47703b" stroke="#d4af55" stroke-width="1"/>
        <path d="M90 18 L94 27 L104 28 L96 34 L98 44 L90 38 L82 44 L84 34 L76 28 L86 27Z" fill="#d4af55" opacity=".9"/>
      </svg>
    </div>
    <div>
      <h1>Alma Jasmine</h1>
      <div class="cover-subtitle">Mis XV años</div>
      <div class="cover-date">04 · 07 · 2026</div>
    </div>
    <div>
      <button class="open-btn" id="openBook">Abrir mi álbum</button>
      <div class="hint">Toca para descubrir nuestra historia</div>
    </div>
  </div>
</section>

<main class="book-area" id="bookArea">
  <header class="book-top">
    <div class="eyebrow">Un cuento que se convirtió en realidad</div>
    <h2>Alma Jasmine · Mis XV años</h2>
    <p>04 de julio de 2026</p>
  </header>
  <nav class="chapter-nav" aria-label="Capítulos del álbum" id="chapterNav"></nav>
  <section class="book" aria-live="polite">
    <article class="page" id="page">
      <div class="page-inner" id="pageContent"></div>
    </article>
  </section>
  <div class="pager">
    <button id="prevPage" type="button">← Anterior</button>
    <span id="pageCount">Página 1 de 7</span>
    <button id="nextPage" type="button">Siguiente →</button>
  </div>
  <div class="site-footer">ALMA JASMINE · MIS XV AÑOS · 2026</div>
</main>

<script>
const chapters = [
 {nav:"El comienzo", kicker:"Prólogo", title:"Todo cuento tiene un comienzo", intro:"Hay noches que se convierten en recuerdos para toda la vida. Esta es la historia de una niña que floreció, soñó y celebró sus quince años rodeada de amor.", quote:"Y así comenzó una noche mágica…", slots:["Una fotografía para abrir esta historia"]},
 {nav:"Pre XV", kicker:"Capítulo I", title:"Antes de la gran noche", intro:"Una sesión para guardar esta etapa, sus sueños y toda la belleza de este momento.", slots:["Retrato principal del Pre XV","Un instante especial","Detalles de la sesión","Otra fotografía favorita"]},
 {nav:"Preparativos", kicker:"Capítulo II", title:"Los detalles de un sueño", intro:"Cada detalle fue parte de la magia: los preparativos, el vestido, los pequeños momentos y la emoción de esperar una noche inolvidable.", slots:["El vestido","Maquillaje y peinado","Los últimos preparativos","Un detalle especial"]},
 {nav:"La celebración", kicker:"Capítulo III", title:"La noche soñada", intro:"El día llegó. Las luces se encendieron y la historia que tanto imaginamos se hizo realidad.", slots:["La decoración","La entrada de Alma","La rosa encantada","Una vista de la celebración"]},
 {nav:"Familia y amigos", kicker:"Capítulo IV", title:"Rodeada de amor", intro:"Los abrazos, las sonrisas y las personas que hicieron esta noche todavía más especial.", slots:["Con la familia","Con amigos","Un abrazo inolvidable","Momentos espontáneos"]},
 {nav:"La fiesta", kicker:"Capítulo V", title:"Que nunca termine la música", intro:"El vals, los bailes, las risas y esos momentos que merecen volver a vivirse una y otra vez.", slots:["El vals","El baile","La pista de baile","El momento más divertido"]},
 {nav:"Videos", kicker:"Capítulo VI", title:"Recuerdos en movimiento", intro:"Hay recuerdos que también se escuchan y se mueven. Aquí vivirán los videos de esta noche.", videos:["Video de la entrada","El vals","Un momento especial de la fiesta"]},
 {nav:"Para siempre", kicker:"Epílogo", title:"Y colorín colorado…", intro:"Los quince años pasan en una noche, pero los recuerdos que nacen en ella pueden acompañarnos toda la vida.", quote:"Que nunca dejes de soñar, de florecer y de escribir tu propia historia.", slots:["La fotografía final del álbum"]}
];
let current = 0;
const pageContent = document.getElementById("pageContent");
const pageCount = document.getElementById("pageCount");
const nav = document.getElementById("chapterNav");
function render(){
 const c=chapters[current];
 pageContent.innerHTML = `<div class="page-kicker">${c.kicker}</div><h3>${c.title}</h3><p class="page-intro">${c.intro}</p>`;
 if(c.slots){
   const grid=document.createElement("div");grid.className="photo-grid";
   c.slots.forEach((s,i)=>{const d=document.createElement("div");d.className="photo-slot"+(i===0&&c.slots.length===1?" wide":"");d.innerHTML=`<span>＋ ${s}<br><small>Fotografía por incorporar</small></span>`;grid.appendChild(d)});
   pageContent.appendChild(grid);
 }
 if(c.videos){
   c.videos.forEach(v=>{const d=document.createElement("div");d.className="video-slot";d.textContent="▶  "+v+" · video por incorporar";pageContent.appendChild(d)});
 }
 if(c.quote){const q=document.createElement("div");q.className="end-quote";q.textContent=c.quote;pageContent.appendChild(q)}
 pageCount.textContent=`Página ${current+1} de ${chapters.length}`;
 document.getElementById("prevPage").disabled=current===0;
 document.getElementById("nextPage").disabled=current===chapters.length-1;
 [...nav.children].forEach((b,i)=>b.classList.toggle("active",i===current));
 document.getElementById("page").animate([{opacity:.5,transform:"rotateY(-4deg)"},{opacity:1,transform:"rotateY(0)"}],{duration:420,easing:"ease-out"});
}
chapters.forEach((c,i)=>{const b=document.createElement("button");b.type="button";b.textContent=c.nav;b.addEventListener("click",()=>{current=i;render()});nav.appendChild(b)});
document.getElementById("openBook").addEventListener("click",()=>{
 document.getElementById("coverScreen").style.display="none";
 const area=document.getElementById("bookArea");area.classList.add("visible");render();window.scrollTo({top:0,behavior:"smooth"});
});
document.getElementById("prevPage").addEventListener("click",()=>{if(current>0){current--;render()}});
document.getElementById("nextPage").addEventListener("click",()=>{if(current<chapters.length-1){current++;render()}});
</script>
</body>
</html>
