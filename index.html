<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>Alma Jasmine — Mis XV años</title>
<style>
:root{--ruby:#B5122B;--cherry:#8E1029;--gold:#D4AF55;--gold-light:#E9D39A;--ivory:#F8EBD5;--paper:#FBF6EC;--ink:#4A3030;--muted:#927B6D;--line:rgba(173,132,58,.35)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;background:#eee3d4}button{font:inherit}
/* PORTADA: terciopelo rubí, sin marcos ni cartelas */
.cover-screen{min-height:100svh;display:grid;place-items:center;position:relative;overflow:hidden;padding:34px 18px;background:radial-gradient(ellipse at 50% 42%,#bd1a38 0%,#9d102c 47%,#760b23 100%)}
.cover-screen:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.20;background:repeating-linear-gradient(94deg,rgba(255,255,255,.035) 0 1px,transparent 1px 5px),radial-gradient(ellipse at 20% 15%,rgba(255,255,255,.11),transparent 40%),radial-gradient(ellipse at 80% 80%,rgba(0,0,0,.18),transparent 45%)}
.cover{width:min(680px,96vw);min-height:min(850px,94svh);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:35px 18px 28px;color:var(--ivory)}
.cover-date{font-size:13px;letter-spacing:.28em;color:var(--gold-light);margin-top:24px;text-transform:uppercase}
.rose-stage{width:min(440px,78vw);height:min(490px,54svh);min-height:330px;position:relative;display:grid;place-items:center;margin:0 auto -6px}
.rose-art{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 18px 20px rgba(30,0,9,.28))}
.cover-name{position:absolute;z-index:3;top:48%;left:50%;transform:translate(-50%,-50%);width:110%;font-family:'Allura','URW Chancery L','Apple Chancery',cursive;font-weight:600;font-size:clamp(64px,12vw,108px);line-height:.86;letter-spacing:-.025em;color:#E7CD8B;text-shadow:0 1px 0 #fff0c5,0 3px 9px rgba(30,0,8,.55);white-space:nowrap}
.cover-subtitle{font-family:'Allura','URW Chancery L',cursive;font-size:clamp(30px,5vw,43px);line-height:1;color:#F4E6C7;margin-top:5px;text-shadow:0 2px 8px rgba(30,0,8,.32)}
.cover-motto{font-family:'Allura','URW Chancery L',cursive;font-size:clamp(24px,4vw,33px);color:#E7CD8B;margin-top:10px;letter-spacing:.01em}
.open-link{display:inline-flex;align-items:center;gap:12px;margin-top:30px;padding:12px 4px 9px;border:0;border-bottom:1px solid rgba(231,205,139,.8);background:transparent;color:#F8EBD5;letter-spacing:.13em;text-transform:uppercase;font-size:11px;cursor:pointer;transition:gap .25s,color .25s}
.open-link:hover{gap:18px;color:#fff}.open-link .arrow{font-size:17px;line-height:10px;color:var(--gold-light)}
/* LIBRO */
.book-area{display:none;min-height:100svh;padding:34px 14px 55px;background:radial-gradient(ellipse at top,#fffaf1 0%,#f0e5d5 72%,#e7d8c5 100%)}.book-area.visible{display:block;animation:fadein .7s ease}@keyframes fadein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.book-heading{text-align:center;margin:0 auto 24px}.book-heading .eyebrow{font-family:'Vivaldi','URW Chancery L',cursive;color:#9A7438;font-size:19px}.book-heading h2{font-family:'Allura','URW Chancery L',cursive;font-weight:400;color:var(--cherry);font-size:clamp(35px,6vw,50px);margin:0}.book-heading p{font-family:'Vivaldi','URW Chancery L',cursive;color:#967c66;font-size:17px;margin:0}
.book-wrap{width:min(1120px,100%);margin:0 auto;perspective:2200px}.book-spread{display:grid;grid-template-columns:1fr 1fr;min-height:650px;position:relative;filter:drop-shadow(0 22px 28px rgba(80,49,26,.17));transform-style:preserve-3d}
.book-page{position:relative;min-width:0;min-height:650px;padding:clamp(28px,4vw,55px);background:linear-gradient(90deg,rgba(156,119,74,.06),transparent 9%),var(--paper);border:1px solid #e5d8c1;overflow:hidden}
.book-page.left{border-radius:5px 0 0 5px;box-shadow:inset -14px 0 22px -23px rgba(58,34,20,.45)}.book-page.right{border-radius:0 5px 5px 0;background:linear-gradient(270deg,rgba(156,119,74,.05),transparent 9%),var(--paper);box-shadow:inset 14px 0 22px -23px rgba(58,34,20,.4)}
.book-page:before,.book-page:after{content:"";position:absolute;width:190px;height:158px;pointer-events:none;background-image:url('rosas-botanicas.svg');background-size:contain;background-repeat:no-repeat;z-index:0;opacity:.96}.book-page:before{top:8px;left:5px}.book-page:after{right:5px;bottom:7px;transform:rotate(180deg)}.page-content{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:535px;display:flex;flex-direction:column;justify-content:center}
.page-kicker{text-align:center;font-family:'Vivaldi','URW Chancery L',cursive;font-size:19px;color:#A27D3E;margin-bottom:8px}.page-title{text-align:center;font-family:'Allura','URW Chancery L',cursive;font-weight:400;font-size:clamp(34px,4vw,49px);line-height:1.02;color:var(--cherry);margin:0 0 14px}.page-intro{text-align:center;font-family:'Vivaldi','URW Chancery L',cursive;font-size:20px;line-height:1.4;color:#786254;max-width:420px;margin:0 auto 22px}
.dedication{font-family:'Vivaldi','URW Chancery L',cursive;font-size:clamp(17px,1.6vw,20px);line-height:1.38;color:#574744;text-align:center}.dedication p{margin:0 0 12px}.dedication-title{font-family:'Allura','URW Chancery L',cursive;font-size:42px;color:#A67D36;text-align:center;margin:0 0 17px}.dedication-sign{font-family:'Allura','URW Chancery L',cursive;font-size:33px;color:#A67D36;margin-top:4px}
.index-list{list-style:none;padding:0;margin:22px auto 0;width:100%;max-width:420px}.index-list li{border-bottom:1px solid rgba(174,139,80,.22)}.index-list a{display:flex;align-items:baseline;gap:12px;text-decoration:none;padding:9px 3px;color:#70564a;font-family:'Vivaldi','URW Chancery L',cursive;font-size:21px;transition:color .2s, padding .2s}.index-list a:hover{color:var(--cherry);padding-left:9px}.index-num{font-family:'Cormorant Garamond',serif;color:#B18A48;font-size:13px;letter-spacing:.12em;min-width:24px}
.photo-layout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.photo-slot{position:relative;min-height:155px;display:grid;place-items:center;text-align:center;padding:14px;background:linear-gradient(145deg,#f5ecdf,#eee1cf);border:1px solid rgba(188,153,99,.28);overflow:hidden;color:#967c66;font-family:'Vivaldi','URW Chancery L',cursive;font-size:18px}.photo-slot.feature{grid-column:1/-1;min-height:225px}.photo-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.photo-slot .placeholder{position:relative;z-index:1;max-width:90%;padding:7px 10px;background:rgba(251,246,236,.78)}
.video-slot{margin:12px 0;padding:20px 14px;text-align:center;background:#f4ecdf;border:1px solid rgba(188,153,99,.28);color:#8e765f;font-family:'Vivaldi','URW Chancery L',cursive;font-size:20px}.video-slot video{display:block;width:100%;max-height:340px;margin:0 auto}.closing-quote{font-family:'Allura','URW Chancery L',cursive;text-align:center;color:var(--cherry);font-size:34px;line-height:1.2;margin:22px auto;max-width:400px}
.page-number{position:absolute;bottom:23px;left:0;right:0;text-align:center;color:#B18A48;font-family:'Vivaldi','URW Chancery L',cursive;font-size:19px;z-index:2}.page-number:before{content:"";display:inline-block;width:20px;border-top:1px solid rgba(177,138,72,.4);vertical-align:middle;margin-right:8px}.page-number:after{content:"";display:inline-block;width:20px;border-top:1px solid rgba(177,138,72,.4);vertical-align:middle;margin-left:8px}
.book-controls{display:flex;align-items:center;justify-content:center;gap:22px;margin:20px auto 0;color:#947d68}.book-controls button{border:0;background:transparent;color:var(--cherry);font-size:13px;letter-spacing:.08em;padding:9px 4px;cursor:pointer;border-bottom:1px solid rgba(212,175,85,.65);transition:color .2s,opacity .2s}.book-controls button:hover{color:#B5122B}.book-controls button:disabled{opacity:.3;cursor:default}.spread-count{font-family:'Vivaldi','URW Chancery L',cursive;font-size:18px;color:#9b805f;min-width:100px;text-align:center}
.turning .book-page.right{animation:turnPage .72s ease both;transform-origin:left center}@keyframes turnPage{0%{transform:rotateY(0);opacity:1}45%{opacity:.82}100%{transform:rotateY(-8deg);opacity:1}}
.book-footer{text-align:center;margin:28px auto 0;color:#a18a73;font-size:11px;letter-spacing:.18em}
@media(max-width:760px){.book-area{padding:22px 12px 40px}.book-heading{margin-bottom:15px}.book-spread{display:block;min-height:590px}.book-page{display:none;min-height:590px;padding:32px 25px}.book-page:before,.book-page:after{width:150px;height:125px;opacity:.9}.book-page.active-mobile{display:block;border-radius:5px;box-shadow:0 14px 28px rgba(80,49,26,.12)}.book-page.left,.book-page.right{border-radius:5px}.page-content{min-height:500px}.dedication{font-size:19px}.photo-layout{gap:9px}.photo-slot{min-height:140px}.photo-slot.feature{min-height:190px}.book-controls{gap:16px}}
@media(max-width:420px){.cover{min-height:90svh}.rose-stage{min-height:300px;height:42svh}.cover-name{font-size:64px}.cover-date{font-size:11px}.book-page{padding:28px 19px}.book-page:before,.book-page:after{width:125px;height:105px}.dedication{font-size:17px}.index-list a{font-size:19px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>

  <div class="cover">

        <defs>

          <linearGradient id="petal" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#ff5266"/><stop offset=".42" stop-color="#d31439"/><stop offset="1" stop-color="#73051f"/></linearGradient>

          <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#263f29"/><stop offset=".5" stop-color="#8c9c51"/><stop offset="1" stop-color="#263f29"/></linearGradient>
          <linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e7d29b"/><stop offset=".5" stop-color="#9e7435"/><stop offset="1" stop-color="#5e3d24"/></linearGradient>

        <path d="M262 173 C296 158 312 195 271 214 C258 218 249 210 246 199 C261 192 265 184 262 173Z" fill="url(#petal)" stroke="#e9ad5d" stroke-width="1.2"/>

      </svg>
      <div class="cover-name">Alma Jasmine</div>
    </div>
    <div class="cover-subtitle">Mis XV años</div>
    <div class="cover-motto">Un recuerdo para toda la vida</div>

    <button class="open-link" id="openBook" type="button">Abrir mi álbum <span class="arrow">↗</span></button>

</section>

<main class="book-area" id="bookArea">
  <header class="book-heading"><div class="eyebrow">Un cuento que se convirtió en realidad</div><h2>Alma Jasmine · Mis XV años</h2><p>04 de julio de 2026</p></header>
  <section class="book-wrap" aria-label="Álbum de recuerdos">
    <div class="book-spread" id="bookSpread">
      <article class="book-page left" id="leftPage"></article>
      <article class="book-page right" id="rightPage"></article>
    </div>
  </section>
  <div class="book-controls">
    <button id="prevSpread" type="button">← Anterior</button>
    <span class="spread-count" id="spreadCount">Páginas 1–2</span>
    <button id="nextSpread" type="button">Siguiente →</button>
  </div>
  <div class="book-footer">ALMA JASMINE · MIS XV AÑOS · 2026</div>
</main>

<script>
const chapters=[
 {id:'comienzo',nav:'El comienzo de un sueño',title:'El comienzo de un sueño',phrase:'Todo gran recuerdo comienza con un sueño.',intro:'Quince años de sueños, aprendizajes y momentos que fueron formando una historia única.',photos:['Una fotografía para abrir esta historia'],feature:true},
 {id:'pre-xv',nav:'Mi sesión Pre-XV',title:'Mi sesión Pre-XV',phrase:'Hay momentos en los que los sueños empiezan a hacerse realidad.',intro:'Una sesión para guardar esta etapa, sus sueños y toda la belleza de este momento.',photos:['Retrato principal del Pre-XV','Un instante especial','Detalles de la sesión','Otra fotografía favorita']},
 {id:'preparativos',nav:'Los preparativos',title:'Los preparativos',phrase:'Cada detalle guardaba un poquito de ilusión.',intro:'El vestido, los detalles y la emoción de esperar una noche inolvidable.',photos:['El vestido','Maquillaje y peinado','Los últimos preparativos','Un detalle especial']},
 {id:'noche',nav:'La noche soñada',title:'La noche soñada',phrase:'Y llegó el día que tanto esperamos.',intro:'Las luces se encendieron y la historia que tanto imaginamos se hizo realidad.',photos:['La decoración','La entrada de Alma','Un momento especial','Una vista de la celebración']},
 {id:'familia',nav:'Mi familia y amigos',title:'Mi familia y amigos',phrase:'Los momentos más hermosos se comparten con quienes amamos.',intro:'Abrazos, sonrisas y personas que hicieron esta noche todavía más especial.',photos:['Con la familia','Con amigos','Un abrazo inolvidable','Momentos espontáneos']},
 {id:'vals',nav:'El vals y la celebración',title:'El vals y la celebración',phrase:'Hay instantes que el corazón nunca deja de bailar.',intro:'El vals, los bailes, las risas y esos momentos que merecen volver a vivirse.',photos:['El vals','El baile','La pista de baile','El momento más divertido']},
 {id:'videos',nav:'Recuerdos en movimiento',title:'Recuerdos en movimiento',phrase:'Porque algunas emociones merecen volver a vivirse.',intro:'Hay recuerdos que también se escuchan y se mueven. Aquí guardaremos los videos de esta noche.',videos:['La entrada','El vals','Un momento especial de la fiesta']},
 {id:'carta',nav:'Una carta de mamá',title:'Una carta de mamá',phrase:'Mi amor por vos no tiene edad ni final.',intro:'Unas palabras para llevar con vos, hoy y siempre.',closing:true}
];
const pages=[
 {type:'dedication'},
 {type:'index'},
 ...chapters.map(c=>({type:'chapter',chapter:c.id}))
];
let spread=0;const left=document.getElementById('leftPage'),right=document.getElementById('rightPage'),spreadEl=document.getElementById('bookSpread');
const isMobile=()=>window.matchMedia('(max-width:760px)').matches;
function chapterPage(c,pageNo){
 let html=`<div class="page-content"><div class="page-kicker">${c.phrase}</div><h3 class="page-title">${c.title}</h3><p class="page-intro">${c.intro}</p>`;
 if(c.photos){html+='<div class="photo-layout">';c.photos.forEach((label,i)=>{const feature=(c.feature&&i===0)||(i===0&&c.photos.length>2);html+=`<div class="photo-slot ${feature?'feature':''}"><span class="placeholder">${label}<br><small>Fotografía por incorporar</small></span></div>`});html+='</div>'}
 if(c.videos){c.videos.forEach((v)=>{html+=`<div class="video-slot">▶ &nbsp;${v}<br><small>Video por incorporar</small></div>`})}
 if(c.closing){html+='<div class="closing-quote">Que nunca dejes de soñar, de florecer y de escribir tu propia historia.</div><div class="photo-slot feature"><span class="placeholder">La fotografía final del álbum</span></div>'}
 html+='</div>';return pageShell(html,pageNo);
}
function pageShell(content,no){return `${content}<div class="page-number">${no}</div>`}
function makePage(index){
 const p=pages[index];if(!p)return '';
 if(p.type==='dedication'){
  const text=`<div class="page-content"><h3 class="dedication-title">Para mi amada Almita</h3><div class="dedication"><p>Hoy comienza un nuevo capítulo de tu historia. Quince años de sueños, aprendizajes, risas, desafíos y momentos que fueron formando a la maravillosa persona que sos.</p><p>Si pudiera regalarte algo para toda la vida, sería la posibilidad de verte siempre con los ojos con los que te veo yo: única, valiosa, fuerte y llena de luz.</p><p>Que nunca dejes de soñar, que tengas el valor de elegir tu propio camino y que, incluso cuando la vida no sea sencilla, jamás olvides cuánto valés y cuánto amor te rodea.</p><p>Estas páginas guardan fotografías, momentos y recuerdos de un día inolvidable, pero hay algo que ninguna imagen podrá guardar por completo: todo el amor que siento por vos.</p><p>Porque antes de tus quince, después de tus quince y en cada etapa de tu vida, siempre voy a estar orgullosa de ser tu mamá.</p><div class="dedication-sign">Con todo mi amor, hoy y siempre.<br>Mamá ♥</div></div></div>`;return pageShell(text,1);
 }
 if(p.type==='index'){
  let list=chapters.map((c,i)=>`<li><a href="#${c.id}" data-chapter="${i}"><span class="index-num">${String(i+1).padStart(2,'0')}</span><span>${c.nav}</span></a></li>`).join('');
  return pageShell(`<div class="page-content"><div class="page-kicker">Alma Jasmine · Mis XV años</div><h3 class="page-title">Índice de recuerdos</h3><p class="page-intro">Cada página guarda una historia...</p><ol class="index-list">${list}</ol></div>`,2);
 }
 const ci=chapters.findIndex(c=>c.id===p.chapter);return chapterPage(chapters[ci],index+1);
}
function render(){
 const mobile=isMobile();const leftIndex=mobile?spread:spread*2;const rightIndex=mobile?-1:leftIndex+1;
 left.innerHTML=makePage(leftIndex)||'';right.innerHTML=rightIndex<pages.length?makePage(rightIndex):'';
 if(mobile){left.classList.add('active-mobile');right.classList.remove('active-mobile')}else{left.classList.remove('active-mobile');right.classList.remove('active-mobile')}
 const total=mobile?pages.length:Math.ceil(pages.length/2);const start=mobile?leftIndex+1:leftIndex+1;const end=mobile?start:Math.min(leftIndex+2,pages.length);
 document.getElementById('spreadCount').textContent=mobile?`Página ${start} de ${pages.length}`:`Páginas ${start}–${end} de ${pages.length}`;
 document.getElementById('prevSpread').disabled=spread===0;document.getElementById('nextSpread').disabled=spread>=total-1;
 document.querySelectorAll('[data-chapter]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const ci=Number(a.dataset.chapter);const pageIndex=2+ci;spread=mobile?pageIndex:Math.floor(pageIndex/2);render();}));
}
function turn(dir){const total=isMobile()?pages.length:Math.ceil(pages.length/2);if(dir>0&&spread<total-1||dir<0&&spread>0){spread+=dir;spreadEl.classList.remove('turning');void spreadEl.offsetWidth;spreadEl.classList.add('turning');render();}}
document.getElementById('openBook').addEventListener('click',()=>{document.getElementById('coverScreen').style.display='none';document.getElementById('bookArea').classList.add('visible');spread=0;render();window.scrollTo({top:0,behavior:'smooth'});});
document.getElementById('prevSpread').addEventListener('click',()=>turn(-1));document.getElementById('nextSpread').addEventListener('click',()=>turn(1));
window.addEventListener('resize',()=>{const old=spread;spread=0;render();});
let touchX=0;spreadEl.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX},{passive:true});spreadEl.addEventListener('touchend',e=>{const delta=e.changedTouches[0].screenX-touchX;if(Math.abs(delta)>55)turn(delta<0?1:-1)},{passive:true});
</script>
</body>
